<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula-08 - Videos e Audios</title>
</head>
<body>

    <h1>Aula-08 - Videos e Audios</h1>

    <!-- A) Exibir um Vídeo local -->
    <h2>Vídeo Local</h2>
    <video width="600" controls>
        <source src="midia/video-local.mp4" type="video/mp4">
        Seu navegador não suporta a tag de vídeo.
    </video>

    <!-- B) Exibir um áudio local -->
    <h2>Áudio Local</h2>
    <p>Esta pagina demonstra arquivo de áudio em HTML.</p>
    <audio controls>
        <source src="midia/audio-local.mp3" type="audio/mpeg">
        Seu navegador não suporta a tag de áudio.
    </audio>

    <br><br>

    <!-- C e D) Logos com links para as páginas de Youtube e Vimeo -->
    <h2>Plataformas Externas</h2>
    
    <!-- Link para a página do YouTube -->
    <a href="videoyoutube.html">
        <img src="img/youtube-logo.png" alt="Logo YouTube" width="150">
    </a>

    &nbsp;&nbsp;&nbsp; <!-- Espaçamento simples entre as imagens -->

    <!-- Link para a página do Vimeo -->
    <a href="videovimeo.html">
        <img src="img/vimeo-logo.png" alt="Logo Vimeo" width="150">
    </a>

</body>
</html>
