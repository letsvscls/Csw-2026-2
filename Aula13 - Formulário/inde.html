<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Formulário</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Processo seletivo de estágio</h1>

    <form action="#" method="post" enctype="multipart/form-data">
      <h2>Dados do candidato</h2>

      <label for="nome">Nome completo:</label>
      <input type="text" id="nome" name="nome" autocomplete="name" required>
      <br>

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" autocomplete="email" required>
      <br>

      <label for="celular">Celular:</label>
      <input type="tel" id="celular" name="celular" autocomplete="tel" placeholder="(27) 99999-9999" required>
      <br>

      <label for="area">Área de interesse:</label>
      <select id="area" name="area" required>
        <option value="">Selecione uma área</option>
        <option value="desenvolvimento">Desenvolvimento</option>
        <option value="design">Design</option>
        <option value="suporte">Suporte</option>
      </select>
      <br>

      <label for="curriculo">Currículo em PDF:</label>
      <input type="file" id="curriculo" name="curriculo" accept=".pdf" required>
      <br>

      <input type="checkbox" id="lgpd" name="lgpd" required>
      <label for="lgpd">Li o aviso de privacidade e consinto com o tratamento dos meus dados pessoais para fins de participação neste processo seletivo, conforme a LGPD.</label>
      <br>

      <button type="submit">Enviar inscrição</button>
      <button type="reset">Limpar formulário</button>
    </form>
  </main>
</body>
</html>
